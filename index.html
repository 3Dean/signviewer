<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta
      name="description"
      content="View a 3D artwork in your space with augmented reality."
    />
    <title>AR Model Viewer</title>
  </head>
  <body>
    <main class="viewer-page">
      <header class="viewer-page__header">
        <p class="eyebrow">3D preview</p>
        <h1>View the artwork in your space</h1>
        <p>Use one finger to rotate, swipe with two fingers to move, and pinch with two fingers to zoom. Use AR on a supported mobile device.</p>
      </header>

      <div class="model-picker">
        <label for="model-select">Finish</label>
        <select id="model-select" aria-controls="artwork-viewer">
          <option value="/models/woodsRestSign_Model_005.glb">Painted color</option>
          <option value="/models/woodsrestsign_wood.glb">Wood texture</option>
        </select>
      </div>

      <section class="viewer-shell" aria-label="Interactive 3D model">
        <model-viewer
          id="artwork-viewer"
          src="/models/woodsRestSign_Model_005.glb"
          alt="Interactive three-dimensional artwork — painted color finish"
          camera-controls
          touch-action="pan-y"
          auto-rotate
          shadow-intensity="1.5"
          shadow-softness="0.25"
          environment-image="/images/upper-left-studio.hdr"
          exposure="2.0"
          ar
          ar-modes="webxr scene-viewer quick-look"
          ar-placement="floor"
        >
          <div class="progress" slot="progress-bar" aria-label="Loading model">
            <div class="progress__bar"></div>
          </div>
        </model-viewer>

        <div id="viewer-actions" class="viewer-actions" hidden>
          <button id="ar-button" class="ar-button" type="button">
            View in your space
          </button>
        </div>
      </section>

      <p id="model-message" class="model-message" role="status" hidden></p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
